<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A/B 测试 Dashboard</title>
  <style>
    body { margin: 0; background: #f3efe6; color: #1d1a16; font-family: "Segoe UI", "PingFang SC", sans-serif; }
    main { width: min(1180px, calc(100% - 32px)); margin: 30px auto; }
    section { background: #fffdf9; border: 1px solid #e2d9cc; border-radius: 14px; padding: 18px; margin: 14px 0; overflow-x: auto; }
    h1, h2 { margin-top: 0; }
    nav { display: flex; gap: 14px; }
    a { color: #0d6b58; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; border-bottom: 1px solid #e2d9cc; padding: 9px 7px; white-space: nowrap; }
    th { color: #6d655c; }
    button { border: 0; border-radius: 7px; padding: 7px 10px; cursor: pointer; background: #0d6b58; color: white; }
    button.pause { background: #8a4b12; }
    .muted { color: #6d655c; }
  </style>
</head>
<body>
<main>
  <nav><a href="/">销售 Demo</a><a href="/ab-demo.html">A/B 演示</a></nav>
  <h1>A/B 测试 Dashboard</h1>
  <p class="muted" id="status">正在加载……</p>

  <section>
    <h2>实验</h2>
    <table>
      <thead><tr><th>名称</th><th>Key</th><th>状态</th><th>流量</th><th>版本</th><th>操作</th></tr></thead>
      <tbody id="experiments"></tbody>
    </table>
  </section>

  <section>
    <h2>最近 24 小时指标</h2>
    <table>
      <thead><tr><th>版本</th><th>曝光 UV</th><th>点击 UV</th><th>购买 UV</th><th>CTR</th><th>转化率</th><th>订单</th><th>GMV</th></tr></thead>
      <tbody id="metrics"></tbody>
    </table>
  </section>

  <section>
    <h2>最近埋点</h2>
    <table>
      <thead><tr><th>时间</th><th>事件</th><th>用户</th><th>版本</th><th>已归因</th><th>属性</th></tr></thead>
      <tbody id="events"></tbody>
    </table>
  </section>
</main>
<script>
  const status = document.querySelector("#status");
  let selectedExperiment = null;

  function td(text) {
    const cell = document.createElement("td");
    cell.textContent = text == null ? "" : text;
    return cell;
  }

  async function action(id, name) {
    const response = await fetch(`/api/experiments/${id}/${name}`, { method: "POST" });
    const body = await response.json();
    if (!response.ok) throw new Error(body.detail || "操作失败");
    await refresh();
  }

  async function loadExperiments() {
    const response = await fetch("/api/experiments");
    const experiments = await response.json();
    if (!response.ok) throw new Error(experiments.detail || "实验加载失败");
    selectedExperiment = experiments.find(item => item.status === "RUNNING") || experiments[0];
    const tbody = document.querySelector("#experiments");
    tbody.replaceChildren();
    for (const experiment of experiments) {
      const row = document.createElement("tr");
      row.append(td(experiment.name), td(experiment.key), td(experiment.status),
        td(`${experiment.traffic_percent}%`),
        td(experiment.variants.map(variant => `${variant.key}:${variant.weight}%`).join(", ")));
      const controls = td("");
      const button = document.createElement("button");
      const running = experiment.status === "RUNNING";
      button.textContent = running ? "暂停" : "启动";
      button.className = running ? "pause" : "";
      button.onclick = () => action(experiment.id, running ? "pause" : "start").catch(showError);
      controls.append(button);
      row.append(controls);
      tbody.append(row);
    }
  }

  async function loadMetrics() {
    const tbody = document.querySelector("#metrics");
    tbody.replaceChildren();
    if (!selectedExperiment) return;
    const response = await fetch(`/api/experiments/${selectedExperiment.id}/metrics`);
    const metrics = await response.json();
    if (!response.ok) throw new Error(metrics.detail || "指标加载失败");
    const variants = new Map(selectedExperiment.variants.map(item => [item.id, item.key]));
    for (const metric of metrics) {
      const row = document.createElement("tr");
      row.append(td(variants.get(metric.variant_id) || metric.variant_id),
        td(metric.exposure_users), td(metric.click_users), td(metric.purchase_users),
        td(`${(Number(metric.ctr) * 100).toFixed(2)}%`),
        td(`${(Number(metric.conversion_rate) * 100).toFixed(2)}%`),
        td(metric.orders), td(metric.gmv));
      tbody.append(row);
    }
  }

  async function loadEvents() {
    const response = await fetch("/api/events/recent?limit=30");
    const events = await response.json();
    if (!response.ok) throw new Error(events.detail || "事件加载失败");
    const tbody = document.querySelector("#events");
    tbody.replaceChildren();
    for (const event of events) {
      const row = document.createElement("tr");
      row.append(td(event.event_time), td(event.event_name), td(event.user_id),
        td(event.variant_id), td(event.attributed ? "是" : "否"), td(event.properties));
      tbody.append(row);
    }
  }

  function showError(error) {
    status.textContent = error.message;
  }

  async function refresh() {
    try {
      await loadExperiments();
      await Promise.all([loadMetrics(), loadEvents()]);
      status.textContent = `最后刷新：${new Date().toLocaleTimeString()}`;
    } catch (error) {
      showError(error);
    }
  }

  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
